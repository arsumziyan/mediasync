# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
name: MediaSync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your team in Xcode
targets:
  MediaSync:
    type: application
    platform: iOS
    sources: [MediaSync]
    info:
      path: MediaSync/Info.plist
      properties:
        CFBundleDisplayName: MediaSync
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.example.mediasync.refresh]
        NSSpeechRecognitionUsageDescription: Audio is transcribed on-device to tag recordings.
        NSMicrophoneUsageDescription: Needed to analyze audio you import.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # lets the simulator talk to http://localhost:8000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mediasync
        GENERATE_INFOPLIST_FILE: NO
